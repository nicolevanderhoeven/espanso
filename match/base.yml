matches:

  # Print the current date
  - trigger: ";date"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%Y-%m-%d"

  # Print the output of a shell command
  - trigger: ";shell"
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: "echo 'Hello from your shell'"

  # Misc
  - trigger: ";ynab"
    replace: "YNAB"
  - trigger: ";pnic"
    replace: "NICOLE:"
  - trigger: ";rw"
    replace: "Readwise"
  - trigger: ";lip"
    replace: "Learning in public"
  - trigger: ";llip"
    replace: "learning in public"

  # Countries and places
  - trigger: ";nl"
    replace: "the Netherlands"
  - trigger: ";phils"
    replace: "the Philippines"
  - trigger: ";oz"
    replace: "Australia"
  - trigger: ";pt"
    replace: "Portugal"
  - trigger: ";sin"
    replace: "Singapore"
  - trigger: ";iz"
    replace: "İzmir"

  

